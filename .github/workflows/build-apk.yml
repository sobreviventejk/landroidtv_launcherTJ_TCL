# Builds an installable APK of this (customized) launcher on GitHub, no local setup needed.
#
# How to use: open the "Actions" tab of your fork -> "Build APK" -> "Run workflow".
# When it finishes, download the "tv-launcher-apk" artifact (a zip with app-release.apk).
#
# Signing: the key is YOUR OWN key. The first run creates it and GitHub keeps it in the Actions
# cache, so every later build is signed with the same key and installs over the old app without
# uninstalling (your categories and settings stay). GitHub removes a cache that is not used for 7
# days; if that happens a new key is created and you must uninstall the app once (use
# "Exportar configurações" in the launcher first). To keep one key forever, create the repo secrets
# KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD.
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore signing key from cache
        id: keycache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/persisted-keystore
          key: tv-launcher-signing-key-v1

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          KEY_DIR="$RUNNER_TEMP/persisted-keystore"
          mkdir -p "$KEY_DIR"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$SECRET_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            if [ ! -f "$KEY_DIR/release.keystore" ]; then
              echo "Creating a new signing key (it is saved in the Actions cache for the next builds)"
              keytool -genkeypair -v -keystore "$KEY_DIR/release.keystore" \
                -alias tvlauncher -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android -dname "CN=TV Launcher TJ"
            else
              echo "Using the signing key restored from the cache"
            fi
            cp "$KEY_DIR/release.keystore" "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=tvlauncher" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-apk
          path: app-release.apk
